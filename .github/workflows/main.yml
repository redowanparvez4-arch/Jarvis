name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Upgrade Gradle to 9.3.1
        run: sed -i 's/gradle-9.1.0/gradle-9.3.1/g' android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
